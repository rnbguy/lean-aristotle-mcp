[project]
name = "aristotle-mcp"
version = "0.1.0"
description = "MCP server for Harmonic's Aristotle theorem prover"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
    "python-dotenv>=1.2.2",
    "aristotlelib>=2.1.0",
    "anyio>=4.14.2",
    "pathspec>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
aristotle-mcp = "aristotle_mcp:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aristotle_mcp"]

# Type checking - maximum strictness
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
mypy_path = "stubs"
# Extra strict options beyond --strict
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_subclassing_any = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Linting
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["aristotle_mcp"]

# Testing
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/test_live_api.py"
